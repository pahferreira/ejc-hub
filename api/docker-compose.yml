services:
  db:
    image: postgres:17
    container_name: ejc_hub_database
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: ejc_hub
      POSTGRES_PASSWORD: ejc_hub
      POSTGRES_DB: ejc_hub
    volumes:
      # Keeps the dev data across container recreations and image updates.
      - ejc_hub_data:/var/lib/postgresql/data

volumes:
  ejc_hub_data:
